name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ให้ deploy ทีละครั้ง ไม่ชนกัน
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # ใส่ค่าตรงนี้เลย ไม่ต้องพึ่ง repo variables (ย้าย repo ไปบัญชีไหนก็ build ได้)
          # anon key เป็นค่าสาธารณะโดยออกแบบ — ฝังอยู่ในไฟล์ JS ของเว็บอยู่แล้ว ความปลอดภัยจริงอยู่ที่ RLS
          NEXT_PUBLIC_SUPABASE_URL: https://ineeeczrtiufrzsvzehd.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImluZWVlY3pydGl1ZnJ6c3Z6ZWhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzIyNzQsImV4cCI6MjA5NzcwODI3NH0.-9KemcJUak1Q1WQTUnEb5wrrtCEj7u2VV_GDYtvhw-o
          # basePath ฮาร์ดโค้ดให้ตรงชื่อ repo (fleet-app)
          NEXT_PUBLIC_BASE_PATH: /fleet-app

      - uses: actions/configure-pages@v5
        with:
          enablement: true    # เปิด GitHub Pages ให้อัตโนมัติถ้ายังไม่ได้เปิด

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
